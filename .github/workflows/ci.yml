name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zilliz_cli: ["absent", "present"]
    env:
      ZILLIZ_CLI_VERSION: "0.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync --all-extras --dev
      - name: Install zilliz CLI
        if: matrix.zilliz_cli == 'present'
        uses: actions/cache@v4
        id: cache-zilliz
        with:
          path: ~/.local/bin/zilliz
          key: zilliz-cli-${{ env.ZILLIZ_CLI_VERSION }}
      - name: Download zilliz CLI
        if: matrix.zilliz_cli == 'present' && steps.cache-zilliz.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://raw.githubusercontent.com/zilliztech/zilliz-cli/master/install.sh" -o "$HOME/.local/bin/zilliz"
          chmod +x "$HOME/.local/bin/zilliz"
      - name: Expose zilliz on PATH
        if: matrix.zilliz_cli == 'present'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Lint
        if: matrix.zilliz_cli == 'absent'
        run: uv run ruff check .
      - name: Format check
        if: matrix.zilliz_cli == 'absent'
        run: uv run ruff format --check .
      - name: Type check
        if: matrix.zilliz_cli == 'absent'
        run: uv run mypy skills/zilliz-launchpad/scripts
      - name: SKILL.md line-length check
        if: matrix.zilliz_cli == 'absent'
        run: |
          lines=$(wc -l < skills/zilliz-launchpad/SKILL.md)
          if [ "$lines" -gt 500 ]; then
            echo "ERROR: SKILL.md has $lines lines (>500)" >&2
            exit 1
          fi
      - name: Unit tests
        run: uv run pytest -m "not cloud and not e2e"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/zilliz-launchpad/scripts/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run lint --if-present
      - run: npm run build
      - name: Secret leak check
        run: |
          if grep -rE "OPENAI_API_KEY|ZILLIZ_TOKEN|COHERE_API_KEY|VOYAGE_API_KEY" .next/; then
            echo "ERROR: secret-like strings found in UI bundle" >&2
            exit 1
          fi
