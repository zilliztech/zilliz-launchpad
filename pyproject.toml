[project]
name = "zilliz-launchpad"
version = "0.1.0"
description = "AI-powered scaffold for Milvus / Zilliz Cloud search apps"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Zilliz" }]
dependencies = [
    "pymilvus>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "jsonschema>=4.23",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "cohere>=5.10",
    "voyageai>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["skills/zilliz-launchpad/scripts/ui", "skills/zilliz-launchpad/scripts/runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["skills/zilliz-launchpad/scripts/ui", "skills/zilliz-launchpad/scripts/runs", "tests/fixtures"]

[[tool.mypy.overrides]]
module = ["pymilvus.*", "voyageai.*", "cohere.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["skills/zilliz-launchpad/scripts"]
testpaths = ["tests"]
markers = [
    "cloud: requires Zilliz Cloud credentials (excluded from default CI)",
    "e2e: requires running Milvus Standalone",
]
